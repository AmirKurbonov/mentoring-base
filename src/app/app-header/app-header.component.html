<div class="header">
    <div class="header-container">
      <div class="header-Left">
        <img src="/assets/Frame.svg" alt="Logo">
        <nav class="Sections-Bottom">
          <div class="Bottom-Menu">
            <a class="nav-item" *ngFor="let item of nav">{{item}}</a>
          </div>
        </nav>
        <button (click)="deleteCatalog()" style="cursor: pointer;">Delete Catalog</button>
        <button (click)="changeMenuText()" style="cursor: pointer;">Upper/LowerCase Menu</button>
        <button [routerLink]="isToggled ? '/' : '/users-list'" (click)="isToggled = !isToggled" style="cursor: pointer;">Users</button>
        <button [routerLink]="isToggled ? '/' : '/todos'" (click)="isToggled = !isToggled" style="cursor: pointer;">Todos</button>
      </div>
      <div class="header-Right">
        <div class="phone-bar">
          <img src="/assets/Phone.svg" alt="Phone">
          <div class="Phone-Number">+7 (965) 084-29-29</div>
        </div>
        <div class="heart">
          <img src="/assets/heart 1.svg" alt="Heart-1">
        </div>
        <button class="Frame-3">
            <img src="/assets/Mask group.svg" alt="Busket-Logo">
            <span class="Busket-Text">Пусто</span>
        </button>
      </div>
    </div>
  </div>
  <div class="Light-TopBar">
    <div class="Light-Container">
      <div class="Select">
        <img src="/assets/light.svg" alt="Catalog-Logo" style="cursor: pointer;">
        <div class="header-item" *ngFor="let item of menuItems">{{item}}</div>
      </div>
      <div class="Search-Area">
        <input type="search" placeholder="Поиск, например Круг зачистной">
        <img src="/assets/Search.svg" alt="Search-Logo" style="cursor: pointer;">
      </div>
      <div class="Location">
        <img src="/assets/Location.svg" alt="Location-Logo">
        <div class="Location-City">Москва</div>
      </div>
    </div>
  </div>
