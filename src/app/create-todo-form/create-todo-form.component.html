<div style="margin: 0 auto; width: 80%;" >
    <h1>Todo Form</h1>
    <form style="display: flex; flex-direction: column; margin-bottom: 30px;" [formGroup]="formTodo" (ngSubmit)="submitForm()">
        <p>АВТОР ЗАДАЧИ</p>
        <input type="text" class="form-input" formControlName="userId">
        <div 
            *ngIf="formTodo.controls['userId'].invalid && formTodo.controls['userId'].dirty && formTodo.controls['userId'].touched" 
            class="alert">
            <div *ngIf="formTodo.controls['userId'].errors">Необходимо ввести автора или автор введен неправильно</div>
        </div>
        <p>ТЕКСТ ЗАДАЧИ</p>
        <input type="text" class="form-input" formControlName="title">
        <div 
            *ngIf="formTodo.controls['title'].invalid && formTodo.controls['title'].dirty && formTodo.controls['title'].touched" 
            class="alert">
            <div *ngIf="formTodo.controls['title'].errors">Необходимо написать задачу или задача введена неправильно</div>
        </div>
        <p>ЗАДАЧА РЕШЕНА</p>
        <input type="text" class="form-input" formControlName="completed">
        <div 
            *ngIf="formTodo.controls['completed'].invalid && formTodo.controls['completed'].dirty && formTodo.controls['completed'].touched" 
            class="alert">
            <div *ngIf="formTodo.controls['completed'].errors">ОТВЕТ НЕ КОРРЕКТЕН. Необходимо ввести "Да" или "Нет".</div>
        </div>
        <button type="submit" style="width: 150px; margin-top: 30px" [disabled]="formTodo.invalid">ДОБАВИТЬ ЗАДАЧУ</button>
    </form>
</div>
