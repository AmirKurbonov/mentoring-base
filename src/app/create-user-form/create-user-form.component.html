<div style="margin: 0px auto; padding: 50px;">
    <h1>FORM</h1>
    <div style="margin-bottom: 30px;">
        <form style="display: flex; flex-direction: column;" [formGroup]="form" (ngSubmit)="submitForm()">
            <p>Name:</p>
            <input type="text" class="form-input" formControlName="name">
            <div 
                *ngIf="form.controls['name'].invalid && (form.controls['name'].dirty || form.controls['name'].touched)" 
                class="alert">
                <div *ngIf="form.controls['name'].errors">ИМЯ ВВЕДЕНО НЕПРАВИЛЬНО</div>
            </div>
            <p>Email:</p>
            <input type="text" class="form-input" formControlName="email">
            <div 
                *ngIf="form.controls['email'].invalid && (form.controls['email'].dirty || form.controls['email'].touched)" 
                class="alert">
                <div *ngIf="form.controls['email'].errors">EMAIL ВВЕДЕНН НЕПРАВИЛЬНО</div>
            </div>
            <p>Website:</p>
            <input type="text" class="form-input" formControlName="website">
            <div 
                *ngIf="form.controls['website'].invalid && (form.controls['website'].dirty || form.controls['website'].touched)" 
                class="alert">
                <div *ngIf="form.controls['website'].errors">website ВВЕДЕНН НЕПРАВИЛЬНО</div>
            </div>
            <p>Company name:</p>
            <input type="text" class="form-input" formControlName="companyName">
            <div 
            *ngIf="form.controls['companyName'].invalid && (form.controls['companyName'].dirty || form.controls['companyName'].touched)" 
            class="alert">
            <div *ngIf="form.controls['companyName'].errors">companyName ВВЕДЕНН НЕПРАВИЛЬНО</div>
        </div>
            <button type="submit" style="width: 150px; margin-top: 30px;" [disabled]="form.invalid" [mat-dialog-close]="createUserFields">
                Create user
            </button>
        </form>
    </div>
</div>
