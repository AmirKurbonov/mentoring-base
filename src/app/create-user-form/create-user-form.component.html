<div style="margin: 0 auto; width: 80%;">
    <h1>FORM</h1>
    <div style="margin-bottom: 30px;">
        <form style="display: flex; flex-direction: column;">
            <p>Name:</p>
            <input type="text" class="form-input">
            <p>Email:</p>
            <input type="text" class="form-input">
            <p>Website:</p>
            <input type="text" class="form-input">
            <p>Company name:</p>
            <input type="text" class="form-input">
            <button (click)="createUser($event)" type="submit" style="width: 150px; margin-top: 30px;">
                Create user
            </button>
        </form>
    </div>
    
</div>
