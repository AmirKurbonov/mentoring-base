<mat-card class="User-Card">
    <mat-card-header>
        <mat-card-title>{{user.name}}</mat-card-title>
        <mat-card-subtitle>{{user.company.name}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <p>{{user.email}}</p>
        <p>{{user.website}}</p>
    </mat-card-content>
    <mat-card-actions>
        <button mat-raised-button color="warn" class="UserCard-DeleteButton" (click)="userDeleteDialog()">Delete user</button>
        <button mat-raised-button color="primary" class="UserCard-DeleteButton" (click)="openEditDialog()">Edit user</button>
      </mat-card-actions>
</mat-card>
