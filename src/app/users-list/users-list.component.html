
<div class="UsersList-Container">
    <div *ngFor="let item of usersService.usersSubject | async">
        <app-user-card [user]="item" 
        (deleteUser)="deleteUser($event)" 
        (editUser)="editUser($event)">
        </app-user-card>
    </div>
    <button (click)="openCreateDialog()">
        Create user
    </button>
</div>
