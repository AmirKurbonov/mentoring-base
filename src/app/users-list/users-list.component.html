<div class="UsersList-Container">
    <div *ngFor="let user of users$ | async">
        <app-user-card 
            [user]="user" 
            (deleteUser)="deleteUser($event)" 
            (editUser)="editUser($event)"
        ></app-user-card>
    </div>
    <button (click)="openCreateDialog()">Create user</button>
</div>
